<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSVP Admin</title><link rel="stylesheet" href="/styles.css"><style>
.admin{width:min(100%,1000px)}.admin h1{font-size:2.5rem}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{width:auto}.panel{background:var(--section-bg);padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.grid label{margin:0}.grid input,.grid select{margin:5px 0 12px}.small{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--border)}.scroll{overflow:auto}
</style></head><body><main class="page"><section class="card admin"><p class="eyebrow">PRIVATE MANAGEMENT</p><h1>RSVP Admin</h1>
<div id="loginPanel" class="panel"><label>Admin password</label><input id="password" type="password" autocomplete="current-password"><button id="login">Sign in</button></div>
<div id="dashboard" hidden>
<div class="tabs"><button data-tab="guests">Guests</button><button data-tab="responses">Responses</button><button data-tab="design">Website appearance</button><button id="logout">Log out</button></div>
<section id="guests" class="panel"><h2>Guest list</h2><div class="grid"><label>Guest full name<input id="newName"></label><label>Seat allowance (including guest)<input id="newSeats" type="number" min="1" max="20" value="1"></label></div><button id="addGuest">Add guest</button><p class="small">Guest names must be unique. Add guests before they can look up invitations.</p><div id="guestList" class="scroll"></div></section>
<section id="responses" class="panel" hidden><h2>Attendance responses</h2><button id="refreshResponses">Refresh</button><div id="responseList" class="scroll"></div></section>
<section id="design" class="panel" hidden><h2>Website appearance</h2><p class="small">Changes are saved to the database and appear on the public RSVP page.</p><div id="designFields" class="grid"></div><button id="saveDesign">Save design</button><button id="resetDesign" style="margin-top:8px">Restore default design</button></section>
</div><p id="status" role="status"></p></section></main><script src="/admin.js"></script></body></html>
